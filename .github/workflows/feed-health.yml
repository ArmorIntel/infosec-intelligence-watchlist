name: Monthly feed health check

# Checks every feed of the watchlist, then:
# - keeps each feed's monthly status on the "feed-health-history" branch, so a
#   feed is only reported after failing 3 months in a row (temporary outages
#   and anti-bot blocks don't need any action)
# - opens a pull request with automatic fixes: replacement URL found on the
#   same website for dead feeds, removal of abandoned feeds
# - keeps a single "feed-health" issue with what is left to review, and closes
#   it when there is nothing left

on:
  schedule:
    - cron: "0 6 1 * *" # 1st day of each month, 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: feed-health
  cancel-in-progress: false

env:
  HISTORY_BRANCH: feed-health-history
  FIX_BRANCH: feed-health/autofix
  PERSIST_MONTHS: "3"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the fix branch is compared with main
          persist-credentials: false # git asks gh for the token, only in the steps that push

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Configure git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"  # for the history branch
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Load the history of previous checks
        run: |
          if git fetch -q origin "$HISTORY_BRANCH:refs/remotes/origin/$HISTORY_BRANCH"; then
            git show "origin/$HISTORY_BRANCH:history.json" > history.json
            echo "HISTORY_EXISTS=1" >> "$GITHUB_ENV"
          else
            echo "No history yet, starting a new one."
            echo '{}' > history.json
          fi

      - name: Check feeds
        run: |
          python3 scripts/check_feeds.py --retry-delay 120 --history history.json \
            --persist-months "$PERSIST_MONTHS" --json results.json > /dev/null

      - name: Save the history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$HISTORY_EXISTS" ]; then
            git worktree add -q history-branch "origin/$HISTORY_BRANCH"
            cd history-branch
          else
            git worktree add -q --detach history-branch
            cd history-branch
            git switch -q --orphan "$HISTORY_BRANCH"
          fi
          cp ../history.json history.json
          git add history.json
          if git diff --cached --quiet; then
            echo "History unchanged."
          else
            git commit -q -m "Feed health history $(date -u +%Y-%m-%d)"
            git push -q origin "HEAD:refs/heads/$HISTORY_BRANCH"
          fi

      - name: Look for automatic fixes
        run: |
          python3 scripts/autofix_feeds.py --json results.json --pr-body pr.md \
            --commit-message commit.txt --persist-months "$PERSIST_MONTHS"

      - name: Open or update the fix pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/bot_pr.py exits 3 when the branch has someone else's commits: left untouched
          rc=0
          if [ ! -s pr.md ]; then
            python3 scripts/bot_pr.py close --branch "$FIX_BRANCH" \
              --comment "No automatic fix needed any more." --output pr-url.txt || rc=$?
            if [ "$rc" = 3 ]; then echo "PR_URL=$(cat pr-url.txt)" >> "$GITHUB_ENV"; exit 0; fi
            echo "PR_URL=" >> "$GITHUB_ENV"
            exit "$rc"
          fi
          python3 scripts/validate_opml.py
          # main only takes pull requests: the generated files come with the change
          python3 scripts/build_category_opml.py --readme
          python3 scripts/bot_pr.py publish --branch "$FIX_BRANCH" --title "Feed fixes - $(date -u +%Y-%m)" \
            --body-file pr.md --commit-message-file commit.txt --output pr-url.txt \
            infosec-intelligence-watchlist.xml scripts/feed-exceptions.txt opml README.md || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
          echo "PR_URL=$(cat pr-url.txt)" >> "$GITHUB_ENV"

      - name: Write the report
        run: |
          python3 scripts/check_feeds.py --render results.json --persist-months "$PERSIST_MONTHS" \
            --pr-url "$PR_URL" --markdown report.md --status-file status.txt > /dev/null
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the feed-health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create feed-health --color d93f0b --description "Monthly feed health report" --force
          number=$(gh issue list --label feed-health --state open --json number --jq '.[0].number')
          if [ "$(cat status.txt)" = "clean" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Nothing left to review on $(date -u +%Y-%m-%d). $(head -1 report.md)"
            fi
            echo "Nothing to review."
            exit 0
          fi
          {
            echo "_Automatic report from [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), updated every month and closed automatically once nothing is left to review._"
            echo
            cat report.md
          } > body.md
          # GitHub limits issue bodies to 65536 characters
          if [ "$(wc -c < body.md)" -gt 65000 ]; then
            head -c 64000 body.md > body.tmp
            printf '\n\n_Report truncated, see the run artifacts for the full version._\n' >> body.tmp
            mv body.tmp body.md
          fi
          title="Feed health report - $(date -u +%Y-%m)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file body.md
            echo "Updated issue #$number"
          else
            gh issue create --title "$title" --label feed-health --body-file body.md
          fi

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-health-report
          path: |
            report.md
            results.json
            history.json
          if-no-files-found: ignore
