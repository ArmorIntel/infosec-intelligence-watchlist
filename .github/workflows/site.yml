name: Publish the website

# Builds the static website (English and French) from the watchlist and the
# latest articles of its feeds, then deploys it to GitHub Pages. It runs every
# 6 hours, and when the watchlist, the site content or the build scripts change.
# Feeds that fail temporarily keep the articles of the previous published
# version (read from the live data.json), so one outage never empties a page.
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  push:
    branches: [main]
    paths:
      - "infosec-intelligence-watchlist.xml"
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/site_*.py"
      - "scripts/feed_items.py"
      - "scripts/check_feeds.py"
      - "scripts/changelog.py"
      - "scripts/build_category_opml.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for the Changes page
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the unit tests
        run: python3 -m unittest discover -s tests

      - name: Build the website
        run: |
          python3 scripts/build_site.py --out _site \
            --previous-url https://armorintel.github.io/infosec-intelligence-watchlist/data.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
