name: Sync generated files

# The global OPML is the single source of truth. The per-category OPML files
# (opml/) and the generated blocks of the README (category list, feed count,
# subscription table) come with each change, in its pull request: validate-pr.yml
# rejects a pull request where they are out of date, and the bot's pull requests
# regenerate them. main only takes pull requests, so this is a safety net: after
# each change on main, it regenerates them and, if they still differ, opens or
# updates a pull request (branch sync/generated-files) instead of pushing.
# GitHub holds validate-pr.yml on the bot's pull request until the maintainer
# clicks "Approve workflows to run".

on:
  push:
    branches: [main]
    paths:
      - "infosec-intelligence-watchlist.xml"
      - "scripts/build_category_opml.py"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-generated
  cancel-in-progress: false

env:
  SYNC_BRANCH: sync/generated-files

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sync branch is compared with main
          persist-credentials: false # git asks gh for the token when it pushes

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate the watchlist
        run: python3 scripts/validate_opml.py

      - name: Regenerate category OPML files and README
        run: python3 scripts/build_category_opml.py --readme

      - name: Open, update or close the pull request
        run: |
          # scripts/bot_pr.py exits 3 when the branch has someone else's commits: left untouched
          rc=0
          if [ -z "$(git status --porcelain -- opml README.md)" ]; then
            echo "Generated files already up to date."
            python3 scripts/bot_pr.py close --branch "$SYNC_BRANCH" \
              --comment "Generated files are up to date on main." || rc=$?
            if [ "$rc" = 3 ]; then exit 0; fi
            exit "$rc"
          fi
          printf 'Regenerate category OPML files and README\n' > commit.txt
          printf '%s\n' "The per-category OPML files or the generated parts of the README were out of date on main after $GITHUB_SHA. This regenerates them with \`python3 scripts/build_category_opml.py --readme\`." > body.md
          gh auth setup-git
          python3 scripts/bot_pr.py publish --branch "$SYNC_BRANCH" --title "Regenerate category OPML files and README" \
            --body-file body.md --commit-message-file commit.txt --output pr-url.txt opml README.md || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
          echo "Generated files out of date, pull request: $(cat pr-url.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
