name: Feed suggestion

# Checks a source suggested by a visitor with the "Suggest a source" issue form
# (label feed-suggestion): finds the site's feed from the pasted link, checks
# that it is new, valid and active (scripts/suggest_feed.py), then answers on
# the issue with a single comment, edited on later runs, and a
# "suggestion: <status>" label. Already-listed sources are closed. For a new
# valid feed, it also opens a pull request adding it (branch
# suggestion/issue-<n>, one commit on main): an AI proposes the subcategory and
# the English and French descriptions (scripts/suggest_pr.py, scripts/suggest_ai.py),
# the per-category OPML files and the README are regenerated in the same commit,
# and the same checks as validate-pr.yml run first. GitHub holds validate-pr.yml
# on the bot's pull requests until the maintainer clicks "Approve workflows to
# run": the required "validate" check then reports on the PR.
# Later events (an edit, a label) run the check again only if the link differs
# from the one last answered for. The bot never touches a branch that has
# someone else's commits, or whose pull request was merged or closed. The
# maintainer decides what is added. Run it manually to check an issue again.
#
# AI setup: secret AI_API_KEY, variable AI_MODEL, optional variable AI_API_URL
# (OpenAI-compatible chat completions URL, Gemini by default). Without them,
# pull requests open without descriptions.

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to check again"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'feed-suggestion') &&
       (github.event.action != 'labeled' || github.event.label.name == 'feed-suggestion'))
    # at job level, so an event skipped by `if` never cancels a running check;
    # a cancelled check is redone by the next run, as no answer records its link yet
    concurrency:
      group: suggest-feed-${{ github.event.issue.number || inputs.issue }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the suggestion branch is compared with main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the issue and the previous answer
        run: |
          gh issue view "$NUMBER" --json body,author,state > issue.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- feed-suggestion-bot -->"))) | "\(.id)"' |
            head -1 > comment-id.txt
          if [ -s comment-id.txt ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$(cat comment-id.txt)" --jq .body > last.md
          fi
          author=$(jq -r .author.login issue.json)
          gh issue list --label feed-suggestion --author "$author" --state open --json number --jq length > open.txt

      - name: Check the suggested source
        env:
          EVENT: ${{ github.event_name }}
        run: |
          extra=()
          if [ -f last.md ]; then extra+=(--last-comment-file last.md); fi
          if [ "$EVENT" = "workflow_dispatch" ]; then extra+=(--force); fi
          python3 scripts/suggest_feed.py --issue issue.json "${extra[@]}" \
            --open-suggestions "$(cat open.txt)" --json result.json --comment comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the pull request
        # a failure here must not keep the visitor without an answer
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_URL: ${{ vars.AI_API_URL }}
        run: |
          if [ "$(jq -r .status result.json)" != "ready" ]; then
            exit 0
          fi
          url=$(jq -r .feed.url result.json)
          branch="suggestion/issue-$NUMBER"

          # another suggestion already proposes this feed
          gh pr list --state open --limit 200 --json url,headRefName,body,isCrossRepository,author > prs.json
          other=$(python3 -c 'import json, sys; sys.path.insert(0, "scripts"); import suggest_pr
          prs = [p for p in json.load(open("prs.json")) if p["headRefName"] != sys.argv[2]]
          print(suggest_pr.find_open_pr_for_url(prs, sys.argv[1]) or "")' "$url" "$branch")
          if [ -n "$other" ]; then
            echo "$other" > pr-url.txt
            touch pr-existing
            exit 0
          fi

          # the bot's own pull request for this issue (never a fork's or a person's of the same name)
          gh pr list --head "$branch" --state all --limit 20 \
            --json url,state,headRefName,isCrossRepository,author > own.json
          read -r state own < <(python3 -c 'import json, sys; sys.path.insert(0, "scripts"); import suggest_pr
          pr = suggest_pr.bot_pr_for_branch(json.load(open("own.json")), sys.argv[1]) or {}
          print(pr.get("state", "NONE"), pr.get("url", ""))' "$branch")
          if [ "$state" = "OPEN" ]; then echo "$own" > pr-url.txt; fi
          if { [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; } && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "::notice::The pull request of $branch is ${state,,}, left untouched (run manually to start again)"
            exit 0
          fi

          git fetch -q origin main
          lease="refs/heads/$branch:"  # the branch must not exist yet...
          if git ls-remote --exit-code -q origin "refs/heads/$branch" > /dev/null; then
            git fetch -q origin "$branch:refs/remotes/origin/$branch"
            # an amend or rebase keeps the bot as author: check committers too
            if git log "origin/main..origin/$branch" --format='%ae%n%ce' |
                grep -qvxF "41898282+github-actions[bot]@users.noreply.github.com"; then
              echo "::notice::$branch has commits from someone else, left untouched"
              exit 0
            fi
            lease="refs/heads/$branch:$(git rev-parse "origin/$branch")"  # ...or still be where it was checked
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -C "$branch" origin/main
          python3 scripts/suggest_pr.py --result result.json --issue "$NUMBER" --title-file title.txt \
            --commit-message commit.txt --pr-body pr.md --new-urls new.txt
          # main only takes pull requests: the generated files come with the change
          python3 scripts/build_category_opml.py --readme

          # same checks as validate-pr.yml, whose run waits for the maintainer's approval
          python3 -m unittest discover -s tests
          python3 scripts/validate_opml.py
          python3 scripts/check_feeds.py --urls-file new.txt --retry-delay 30 \
            --fail-on dead,inactive,abandoned --markdown checks.md
          { echo; echo "## Checks"; echo; cat checks.md; } >> pr.md

          git add infosec-intelligence-watchlist.xml site/descriptions.json opml README.md
          git commit -q -F commit.txt
          git push -q --force-with-lease="$lease" origin "HEAD:refs/heads/$branch"
          existing=""
          if [ "$state" = "OPEN" ]; then existing="$own"; fi
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$(cat title.txt)" --body-file pr.md
            pr="$existing"
          elif ! pr=$(gh pr create --base main --head "$branch" --title "$(cat title.txt)" --body-file pr.md); then
            # Settings > Actions > "Allow GitHub Actions to create and approve pull requests" is off
            pr="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "::warning::Could not open the pull request, open it from $pr"
          fi
          echo "$pr" > pr-url.txt

      - name: Answer on the issue
        run: |
          status=$(jq -r .status result.json)
          if [ "$status" = "skip" ]; then
            echo "Nothing to do."
            exit 0
          fi
          if [ -s pr-url.txt ]; then
            flags=()
            if [ -f pr-existing ]; then flags=(--pr-existing); fi
            python3 scripts/suggest_feed.py --render result.json --comment comment.md \
              --pr-url "$(cat pr-url.txt)" "${flags[@]}"
          fi
          id=$(cat comment-id.txt)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh issue comment "$NUMBER" --body-file comment.md
          fi

          while read -r name color; do
            gh label create "suggestion: $name" --color "$color" --description "Feed suggestion check result" --force
          done <<'EOF'
          ready 2f9e5b
          duplicate 8a929e
          no-feed e08a00
          inactive 8a929e
          needs-review 1f8fb3
          invalid c93a3a
          EOF
          gh issue view "$NUMBER" --json labels --jq '.labels[].name | select(startswith("suggestion: "))' |
            while read -r old; do
              if [ "$old" != "suggestion: $status" ]; then gh issue edit "$NUMBER" --remove-label "$old"; fi
            done
          if [ "$status" != "limit" ]; then
            gh issue edit "$NUMBER" --add-label "suggestion: $status"
          fi
          if [ "$status" = "duplicate" ]; then
            gh issue close "$NUMBER" --reason "not planned"
          fi
